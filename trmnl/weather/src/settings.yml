---
name: Weather
strategy: polling
polling_verb: get
polling_url: '{{ base_url }}/api/weather'
polling_headers: 'authorization=Bearer {{ screens_token }}'
dark_mode: 'no'
no_screen_padding: 'no'
refresh_interval: 15
custom_fields:
  - keyname: base_url
    field_type: string
    name: Base URL
    description: Origin serving /api/weather
    default: 'https://trmnl.chienleng.com'
  - keyname: screens_token
    field_type: string
    name: Screens token
    description: SCREENS_TOKEN bearer value for the worker
