---
# Local config for the trmnlp previewer (https://github.com/usetrmnl/trmnlp).
# Polls the deployed worker (the local vite server binds ::1-only, which
# Docker's host.docker.internal can't reach — deliberate trade-off to keep the
# dev-server config untouched). Run from this directory:
#
#   SCREENS_TOKEN=<token> docker run --pull always -p 4567:4567 \
#     -v "$(pwd):/plugin" -e SCREENS_TOKEN trmnl/trmnlp serve --bind 0.0.0.0
#
# then open http://localhost:4567. The token is the worker's SCREENS_TOKEN
# secret — injected via env var so it never lands in the repo.
watch:
  - src
time_zone: Australia/Brisbane
custom_fields:
  base_url: https://trmnl.chienleng.com
  screens_token: '{{ env.SCREENS_TOKEN }}'
